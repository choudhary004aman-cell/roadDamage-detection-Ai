openapi: 3.0.3

info:
  title: RoadGuard India API
  description: >
    Backend API for the RoadGuard India student-built road damage
    detection application.
  version: 1.0.0

servers:
  - url: http://127.0.0.1:5000

tags:
  - name: Health
  - name: System
  - name: Localization
  - name: Prediction
  - name: Realtime

paths:

  /health:
    get:
      tags:
        - Health
      summary: Backend liveness
      responses:
        "200":
          description: Backend is running.

  /api/v1/system/status:
    get:
      tags:
        - System
      summary: Backend and AI model status
      parameters:
        - $ref: "#/components/parameters/LanguageHeader"
      responses:
        "200":
          description: System status.

  /api/v1/system/accessibility:
    get:
      tags:
        - System
      summary: Accessibility feature metadata
      parameters:
        - $ref: "#/components/parameters/LanguageHeader"
      responses:
        "200":
          description: Accessibility configuration.

  /api/v1/i18n:
    get:
      tags:
        - Localization
      summary: Get localized backend strings
      parameters:
        - $ref: "#/components/parameters/LanguageQuery"
      responses:
        "200":
          description: Localization payload.

  /api/v1/predict:
    post:
      tags:
        - Prediction
      summary: Analyze road damage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                language:
                  type: string
                  enum:
                    - en
                    - hi
      responses:
        "200":
          description: Prediction completed.
        "413":
          description: File too large.
        "415":
          description: Unsupported file type.
        "422":
          description: Invalid image.
        "503":
          description: AI model unavailable.

  /predict:
    post:
      tags:
        - Prediction
      summary: Frontend compatibility prediction endpoint
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                language:
                  type: string
                  enum:
                    - en
                    - hi
      responses:
        "200":
          description: Prediction completed.

  /api/v1/events/{request_id}:
    get:
      tags:
        - Realtime
      summary: Server-Sent Events prediction status
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream.
          content:
            text/event-stream:
              schema:
                type: string

components:

  parameters:

    LanguageHeader:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        example: hi-IN

    LanguageQuery:
      name: lang
      in: query
      required: false
      schema:
        type: string
        enum:
          - en
          - hi

  schemas:

    BoundingBox:
      type: object
      properties:
        x1:
          type: number
        y1:
          type: number
        x2:
          type: number
        y2:
          type: number

    Detection:
      type: object
      properties:
        id:
          type: integer
        class:
          type: string
        class_code:
          type: string
        confidence:
          type: number
        confidence_percent:
          type: number
        severity:
          type:
            - string
            - "null"
        bbox:
          $ref: "#/components/schemas/BoundingBox"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
        request_id:
          type: string
        language:
          type: string